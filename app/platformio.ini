; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@^4.2.1
framework = arduino
board = d1_mini
lib_deps =
  fastled/FastLED@^3.10.9
  bblanchon/ArduinoJson@^7.4.3
  tzapu/WiFiManager@^2.0.17
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^4.0.6
monitor_speed = 115200

; host unit tests for lib/clock_logic: pio test -e native
[env:native]
platform = native
test_framework = unity

; firmware update over Wi-Fi: OTA_PASSWORD=<_OTA_PASSWORD_> pio run -e d1_mini_ota -t upload
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = 192.168.0.85
upload_flags = --auth=${sysenv.OTA_PASSWORD}
